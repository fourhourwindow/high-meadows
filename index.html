<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Mono&display=swap"
      rel="stylesheet"
    />
    <title>High Meadows</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static twin of the React ContactForm, kept in sync with
      src/components/ContactForm.tsx's field names. Netlify's build bot
      only reads static HTML, so it can't see the form React renders at
      runtime — this hidden copy is what it detects to register the form
      and turn on submission handling. Don't remove this even though it's
      never shown to visitors.

      After deploying: go to the Netlify dashboard > Site configuration >
      Forms > Form notifications > Add notification > Email notification,
      and enter the address that should receive submissions. That step
      happens in the dashboard, not in code.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="date" name="eventDate" />
      <input type="number" name="guestCount" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
